name: AI Papers

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC daily — auto fetch
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        default: fetch
        type: choice
        options:
          - fetch
          - more
          - today
          - search
      search_query:
        description: "Search keyword (only used when action = search)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Determine action
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ github.event.inputs.action }}"       >> "$GITHUB_OUTPUT"
            echo "query=${{ github.event.inputs.search_query }}"  >> "$GITHUB_OUTPUT"
          else
            echo "action=fetch" >> "$GITHUB_OUTPUT"
            echo "query="       >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        env:
          EURI_API_KEY:       ${{ secrets.EURI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
        run: |
          python run.py \
            --action "${{ steps.vars.outputs.action }}" \
            --query  "${{ steps.vars.outputs.query }}"

# Koyeb App Configuration
# https://www.koyeb.com/docs/apps/app-configuration
#
# Deploy steps:
#   1. Push this repo to GitHub
#   2. koyeb app init ai-papers-agent --manifest koyeb.yaml   (CLI)
#      — OR — create the service in the Koyeb dashboard (see README)
#   3. Set secret env vars in the dashboard under Service → Settings → Env

name: ai-papers-agent

services:
  - name: bot
    type: worker
    git:
      url: github.com/YOUR_USERNAME/ai-papers-agent
      branch: main
    build:
      builder: dockerfile
      dockerfile: Dockerfile
    run:
      command: python main.py
    instance_type: nano
    regions:
      - was           # Washington DC — change to fra (Frankfurt) or sin (Singapore) if preferred
    scaling:
      min: 1
      max: 1
    env:
      - key: EURI_API_KEY
        value: ""     # Set as a secret in the Koyeb dashboard
      - key: TELEGRAM_BOT_TOKEN
        value: ""
      - key: TELEGRAM_CHAT_ID
        value: ""
      - key: SUPABASE_URL
        value: ""
      - key: SUPABASE_KEY
        value: ""
    health_checks: []

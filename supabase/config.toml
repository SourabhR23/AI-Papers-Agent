# Supabase project configuration — used by the Supabase CLI.
# https://supabase.com/docs/guides/functions/schedule-functions
#
# Replace YOUR_PROJECT_REF with the value from:
#   Dashboard → Project Settings → General → Reference ID

[project]
project_id = "YOUR_PROJECT_REF"

# ── Edge Function: daily-fetch ────────────────────────────────────────────
# Runs every day at 02:00 UTC.
# Fetches up to 5 new ArXiv papers, explains them with GPT-4o,
# stores all in Supabase, and sends those scoring 7+ to Telegram.

[functions.daily-fetch]
verify_jwt = false
schedule   = "0 2 * * *"
